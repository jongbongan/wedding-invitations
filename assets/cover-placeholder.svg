<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">대표 사진 자리</title>
  <desc id="desc">이 파일을 실제 웨딩 사진으로 교체하세요.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9d1c5"/>
      <stop offset="0.48" stop-color="#eee8df"/>
      <stop offset="1" stop-color="#c8b7aa"/>
    </linearGradient>
    <radialGradient id="light" cx="0.22" cy="0.12" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.76"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="1500" fill="url(#bg)"/>
