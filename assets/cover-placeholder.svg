  <path d="M108 1230 C310 1010 392 1090 560 895 C745 679 878 752 1092 488" fill="none" stroke="#9b7068" stroke-opacity="0.23" stroke-width="3"/>
  <circle cx="600" cy="610" r="150" fill="none" stroke="#fff" stroke-opacity="0.58" stroke-width="2"/>
  <circle cx="600" cy="610" r="126" fill="none" stroke="#fff" stroke-opacity="0.36" stroke-width="2"/>
  <text x="600" y="590" fill="#6e635a" font-family="Georgia, serif" font-size="35" letter-spacing="9" text-anchor="middle">YOUR PHOTO</text>
  <text x="600" y="645" fill="#796e64" font-family="Arial, sans-serif" font-size="21" letter-spacing="4" text-anchor="middle">대표 사진으로 교체하세요</text>
